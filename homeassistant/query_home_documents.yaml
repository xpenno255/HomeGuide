# Paste this into Extended OpenAI Conversation:
#   Settings -> Devices & Services -> Extended OpenAI Conversation -> Configure -> Functions
#
# Replace HOMEGUIDE_HOST with the LAN IP or hostname of your Docker host
# (the machine running the HomeGuide container), keeping port 8480.
#
# Append this block to any functions you already have defined (it's a YAML list).

- spec:
    name: query_home_documents
    description: >-
      Search household manuals and paperwork for appliance instructions, cooking
      guidance, feature explanations, fault codes, cleaning, maintenance and
      warranties. Not for live device states, current modes, sensor readings or
      device control. Include the appliance and exact fault code or topic. Call once
      per user question. Answer only from relevant returned excerpts, citing
      document and page. If results are empty or irrelevant, or status is
      no_match/unavailable, report that the lookup could not answer and finish
      without another tool call. Do not rephrase/retry or search the web unless the
      user explicitly asks.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: >-
            A concise search query in English. Include the appliance name and the
            key terms, e.g. "air fryer chicken cooking time" or
            "Bosch dishwasher fault code E4".
      required:
        - query
  function:
    type: rest
    resource_template: "http://HOMEGUIDE_HOST:8480/query?q={{ query | urlencode }}"
